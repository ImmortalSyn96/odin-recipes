<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bottom Bun -->
  <path d="M25 75 Q25 85 50 85 Q75 85 75 75 Z" fill="#D2B48C" stroke="#8B4513" stroke-width="1.5"/>

  <!-- Vegan Patty (Plant-based) -->
  <rect x="22" y="65" width="56" height="10" rx="3" fill="#6B4226" stroke="#4A2C1D" stroke-width="1"/>
  <!-- Patty Texture -->
  <circle cx="30" cy="70" r="1" fill="#5D3A22"/>
  <circle cx="50" cy="68" r="1" fill="#5D3A22"/>
  <circle cx="70" cy="72" r="1" fill="#5D3A22"/>

  <!-- Tomato Slices -->
  <rect x="25" y="60" width="22" height="5" rx="2" fill="#E53935"/>
  <rect x="53" y="60" width="22" height="5" rx="2" fill="#E53935"/>

  <!-- Lettuce (Wavy) -->
  <path d="M20 60 Q25 52 30 60 Q35 52 40 60 Q45 52 50 60 Q55 52 60 60 Q65 52 70 60 Q75 52 80 60" 
        fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Bun -->
  <path d="M22 55 Q22 25 50 25 Q78 25 78 55 Z" fill="#DEB887" stroke="#8B4513" stroke-width="1.5"/>

  <!-- Sesame Seeds -->
  <g fill="#F5F5DC">
    <ellipse cx="40" cy="35" rx="1.5" ry="0.8" transform="rotate(-20 40 35)"/>
    <ellipse cx="55" cy="32" rx="1.5" ry="0.8" transform="rotate(10 55 32)"/>
    <ellipse cx="48" cy="42" rx="1.5" ry="0.8" transform="rotate(30 48 42)"/>
    <ellipse cx="62" cy="40" rx="1.5" ry="0.8" transform="rotate(-15 62 40)"/>
  </g>

  <!-- Vegan Garnish (Sprout) -->
  <path d="M72 35 Q75 25 82 28" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="82" cy="28" rx="3" ry="1.5" fill="#43A047" transform="rotate(-30 82 28)"/>
</svg>