  <ellipse cx="55" cy="46" rx="4" ry="2" fill="#2E7D32" transform="rotate(20 55 46)"/>
  <ellipse cx="50" cy="42" rx="3" ry="1.5" fill="#4CAF50" transform="rotate(-10 50 42)"/>

  <!-- Parmesan Sprinkles (White dots) -->
  <g fill="#FFFFFF">
    <circle cx="48" cy="52" r="1"/>
    <circle cx="52" cy="50" r="0.8"/>
    <circle cx="45" cy="45" r="0.7"/>
    <circle cx="55" cy="53" r="0.9"/>
    <circle cx="42" cy="50" r="0.6"/>
    <circle cx="58" cy="48" r="0.7"/>
  </g>
</svg>