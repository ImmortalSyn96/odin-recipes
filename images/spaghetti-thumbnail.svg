<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bowl Base -->
  <path d="M20 55 Q20 85 50 85 Q80 85 80 55 Z" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="2"/>
  <ellipse cx="50" cy="55" rx="30" ry="10" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>

  <!-- Noodles (Visible yellow curves) -->
  <g fill="none" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round">
    <path d="M35 55 Q40 45 50 55 Q60 65 70 55"/>
    <path d="M30 52 Q45 40 60 52 Q70 60 75 52"/>
    <path d="M25 58 Q40 48 55 58 Q65 68 75 58"/>
    <path d="M40 50 Q50 35 65 50"/>
    <path d="M32 48 Q42 38 52 48"/>
  </g>

  <!-- Tomato Sauce (Red overlay) -->
  <path d="M35 50 Q50 35 65 50 Q55 60 45 55 Z" fill="#E53935" opacity="0.9"/>
  <path d="M40 55 Q45 52 50 58 Q55 54 60 58" fill="none" stroke="#C62828" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Basil Leaves (Green) -->
